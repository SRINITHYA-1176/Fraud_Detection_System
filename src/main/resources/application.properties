# Application configuration
spring.application.name=fraud-detection-system
server.port=8080

# Kafka broker connection
spring.kafka.bootstrap-servers=localhost:29092

# Kafka producer configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Streams configuration
spring.kafka.streams.application-id=fraud-detection-app

# PostgreSQL connection details
spring.datasource.url=jdbc:postgresql://localhost:5432/fraud_detection_db
spring.datasource.username=fraud_user
spring.datasource.password=fraud_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicit PostgreSQL dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.apache.kafka=INFO
logging.level.org.springframework.kafka=INFO

# ==========================================
# Google Gemini AI Configuration
# ==========================================

# Gemini API key
spring.ai.google.genai.api-key=${GEMINI_API_KEY}

# Gemini model
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite

# Response temperature
spring.ai.google.genai.chat.options.temperature=0.2

